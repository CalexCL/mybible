name: MyBible Chronology Regression
on:
  push:
    branches: [main]
    paths:
      - 'chronology.html'
      - 'data/people_chronology.json'
      - 'data/study.json'
      - 'data/study_batch4.json'
      - 'scripts/test-study-integrity.mjs'
      - 'service-worker.js'
      - 'scripts/test-chronology.mjs'
      - 'scripts/smoke-chronology.mjs'
      - 'scripts/smoke-bilingual.mjs'
      - 'app.js'
      - 'auth.js'
      - 'backend.js'
      - 'scripts/test-cloud-sync.mjs'
      - 'config.js'
      - 'index.html'
      - '.github/workflows/chronology-regression.yml'
  pull_request:
    paths:
      - 'chronology.html'
      - 'data/people_chronology.json'
      - 'data/study.json'
      - 'data/study_batch4.json'
      - 'scripts/test-study-integrity.mjs'
      - 'service-worker.js'
      - 'scripts/test-chronology.mjs'
      - 'scripts/test-cloud-sync.mjs'
      - 'backend.js'
      - 'auth.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Chronology and JavaScript
        run: node scripts/test-chronology.mjs
      - name: Verify non-destructive personal cloud sync
        run: node scripts/test-cloud-sync.mjs
      - name: Validate original-language and cross-reference add-on
        run: node scripts/test-study-integrity.mjs
      - name: Check main app syntax
        run: node --check app.js
      - name: Check PWA service worker syntax
        run: node --check service-worker.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Browser interaction smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mybible-test-server.log 2>&1 &
          node scripts/smoke-chronology.mjs
          node scripts/smoke-bilingual.mjs
